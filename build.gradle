plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest

def minecraftTargets = new JsonSlurper().parse(file('gradle/minecraft-versions.json'))
def target = minecraftTargets[minecraft_version]
if (target == null) {
    throw new GradleException("Unsupported Minecraft version ${minecraft_version}; choose ${minecraftTargets.keySet()}")
}
ext.fabric_api_version = target.fabric_api
ext.modmenu_version = target.modmenu
version = "${mod_version}+${minecraft_version}"
sourceSets.main.java.srcDir("src/compat/${target.client_ui}/java")

base {
    archivesName = 'localchattranslate'
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('jar', Jar) {
    zip64 = true
}

tasks.register('generateBundleManifest') {
    group = 'build'
    description = 'Hashes the bundled llama.cpp runtime and records the pinned default model.'
    inputs.dir(layout.projectDirectory.dir('bundle/llama.cpp'))
    inputs.property('model', [model_file, model_url, model_sha256, model_size])
    outputs.file(layout.buildDirectory.file('generated/bundle/manifest.json'))
    doLast {
        def assets = fileTree('bundle').matching {
            include 'llama.cpp/windows-x64/*.dll', 'llama.cpp/windows-x64/llama-server.exe'
        }.files.sort { a, b -> a.path <=> b.path }
        if (!assets.any { it.name == 'llama-server.exe' }) {
            throw new GradleException('Bundled llama-server is missing')
        }
        def files = assets.collect { asset ->
            def digest = MessageDigest.getInstance('SHA-256')
            asset.withInputStream { stream ->
                byte[] buffer = new byte[1024 * 1024]
                int count
                while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
            }
            [resource: 'bundled/' + project.relativePath(asset).replace('\\', '/').replaceFirst('^bundle/', ''),
             sha256: digest.digest().encodeHex().toString(), size: asset.length()]
        }
        def versionDigest = MessageDigest.getInstance('SHA-256')
        files.each { entry -> versionDigest.update((entry.resource + ':' + entry.sha256 + '\n').getBytes('UTF-8')) }
        def manifest = [bundleVersion: 'b10964-' + versionDigest.digest().encodeHex().toString().substring(0, 16), files: files,
                        model: [file: model_file, url: model_url, sha256: model_sha256, size: model_size as long]]
        def output = layout.buildDirectory.file('generated/bundle/manifest.json').get().asFile
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + '\n'
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('generateBundleManifest')
    def metadata = [version: project.version, minecraft_version: minecraft_version,
                    loader_version: loader_version, fabric_api_version: fabric_api_version]
    inputs.properties metadata
    filesMatching('fabric.mod.json') { expand metadata }
    from('bundle') {
        into 'bundled'
        exclude 'model/**'
    }
    from(layout.buildDirectory.file('generated/bundle/manifest.json')) { into 'bundled' }
}

tasks.register('verifyOriginalBehavior', JavaExec) {
    group = 'verification'
    description = 'Checks recovered chat parsing and placeholder protection without changing the original mod.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'local.chattranslate.OriginalBehaviorSmokeTest'
}

tasks.register('verifyTargetLanguage', JavaExec) {
    group = 'verification'
    description = 'Checks target language resolution, config migration and the unchanged Japanese prompt.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'local.chattranslate.TargetLanguageSmokeTest'
}

tasks.register('verifyModelStore', JavaExec) {
    group = 'verification'
    description = 'Checks model download, resume, redirect, checksum rejection and consent against a local HTTP server.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'local.chattranslate.ModelStoreSmokeTest'
    workingDir = layout.buildDirectory.dir('model-store-smoke').get().asFile
    doFirst { workingDir.mkdirs() }
}

// Places a local copy of the default GGUF where the MOD looks for it, so integration tests never download 2.5 GB.
def seedModel = { String name, Object gameDir ->
    tasks.register(name, Copy) {
        from('bundle/model/translategemma-4b.gguf')
        into(file(gameDir).toPath().resolve("localchattranslate/models/${model_sha256.substring(0, 16)}").toFile())
        rename { model_file }
    }
}
seedModel('seedSmokeModel', layout.buildDirectory.dir('runtime-smoke').get().asFile)
seedModel('seedGameTestModel', file('build/run/clientGameTest'))

tasks.register('verifyRuntimeLifecycle', JavaExec) {
    group = 'verification'
    description = 'Starts the bundled server, translates, recovers from child death, and checks shutdown.'
    dependsOn tasks.named('testClasses'), tasks.named('seedSmokeModel')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'local.chattranslate.RuntimeLifecycleSmokeTest'
}

tasks.register('runOrphanProbe', JavaExec) {
    group = 'verification'
    description = 'Test-only probe for verifying server cleanup after forced JVM termination.'
    dependsOn tasks.named('testClasses'), tasks.named('seedSmokeModel')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'local.chattranslate.JobOrphanProbe'
}

tasks.named('test', Test) {
    // The standalone smoke runner is executed by verifyOriginalBehavior.
    failOnNoDiscoveredTests = false
}

tasks.named('check') {
    dependsOn tasks.named('verifyOriginalBehavior'), tasks.named('verifyTargetLanguage'), tasks.named('verifyModelStore')
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'localchattranslate-reconstruction-test'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}
sourceSets.gametest.java.srcDir("src/compat/${target.client_ui}/gametest")

tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    dependsOn tasks.named('seedGameTestModel')
}
// The game test run directory is wiped before each run; seed the model after that.
tasks.named('seedGameTestModel') {
    mustRunAfter tasks.matching { it.name == 'deleteGameTestRunDir' }
}
